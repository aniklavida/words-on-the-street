name: Release

# Tags are the release trigger. Pushing main or develop never publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build cross-platform binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64)
          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/words-on-the-street_${goos}_${goarch}${ext}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -o "$out" ./cmd/words-on-the-street
          done

      # The checksum is the install guarantee: a consumer verifies the bytes
      # they run against checksums.txt. Publishing binaries without it would
      # make every documented install instruction an unverifiable claim.
      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum words-on-the-street_* > checksums.txt
          test -s checksums.txt
          cat checksums.txt

      - name: Publish release with binaries and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
